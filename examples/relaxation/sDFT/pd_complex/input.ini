[JOB]
task                = Optdensity

[PATH]
pp                  = ../../../DATA
cell                = ../../../DATA

[PP]
;Pd                  = pd_pbe_v1.4.uspp.F.UPF
;O                   = o_pbe_v1.2.uspp.F.UPF
;H                   = h_pbe_v1.4.uspp.F.UPF
;Cl                  = cl_pbe_v1.4.uspp.F.UPF
Pd                  = Pd.pbe-n-rrkjus_psl.1.0.0.UPF
O                   = O.pbe-n-rrkjus_psl.1.0.0.UPF
H                   = H.pbe-rrkjus_psl.1.0.0.UPF
Cl                  = Cl.pbe-n-rrkjus_psl.1.0.0.UPF

[OPT]
maxiter             = 500
econv               = 1e-6
olevel              = 2
maxtime             = 259000

[MOL]
charge-Pd  = 2
charge-H2O = 0
charge-Cl = -1

[GSYSTEM]
cell-file           = pd.xyz
grid-ecut           = 2700
exc-dftd4           = PBE
exc-x_str           = gga_x_pbe
exc-c_str           = gga_c_pbe
kedf-kedf           = GGA
kedf-k_str          = revAPBEK

[SUB_PD]
calculator          = pwscf
embed               = KE XC
cell-cut            = 3.5 3.5 3.5
cell-index          = 0:13
basefile            = qe_in_pd.in
density-use_gaussians = True
mix-coef            = 0.7
nprocs = 15

[SUB_CL]
calculator          = pwscf
embed               = KE XC
cell-cut            = 3.5 3.5 3.5
cell-index          = 13:15
basefile            = qe_in_cl.in
density-use_gaussians = True
decompose-method    = distance
decompose-radius-Cl = 1.20
mix-coef            = 0.7

[SUB_H20]
calculator          = pwscf
embed               = KE XC
cell-cut            = 3.5 3.5 3.5
cell-index          = 15:
basefile            = qe_in.in
density-use_gaussians = True
decompose-method      = distance
decompose-radius-O = 0.8
decompose-radius-H = 0.5
mix-coef            = 0.7
