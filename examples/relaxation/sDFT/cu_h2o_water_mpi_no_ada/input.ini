[JOB]
task               = Optdensity

[PATH]
pp                 = ../../../DATA/
cell               = ../../../DATA/

[PP]
Cu                 = cu_pbe_v1.2.uspp.F.UPF
O                  = o_pbe_v1.2.uspp.F.UPF
H                  = h_pbe_v1.4.uspp.F.UPF
Cl                 = cl_pbe_v1.4.uspp.F.UPF

[OPT]
maxiter            = 500
econv              = 1e-6
olevel             = 3
maxtime             = 259000

[MOL]
charge-Cu          = 2
charge-H2O         = 0
charge-Cl          = -1

[GSYSTEM]
cell-file          = cu_hexa.xyz
grid-ecut          = 2700
exc-dftd4           = PBE
exc-x_str          = gga_x_pbe
exc-c_str          = gga_c_pbe
kedf-kedf          = GGA
kedf-k_str         = revAPBEK
density-output     = total.xsf

[SUB_CU]
calculator         = qe
embed              = KE XC
basefile            = qe_in_cu.in
cell-cut            = 3.5 3.5 3.5
cell-index         = 0:19
density-use_gaussians = True
density-output     = .xsf
mix-coef = 0.7
nprocs = 14

[SUB_CL]
calculator          = pwscf
embed               = KE
cell-cut            = 3.5 3.5 3.5
cell-index          = 19:21
basefile            = qe_in_cl.in
density-use_gaussians = True
mix-coef            = 0.7
nprocs = 1

[SUB_H2O]
calculator         = qe
embed              = KE XC
cell-cut            = 3.5 3.5 3.5
cell-index         = 21:
basefile            = qe_in.in
decompose-method   = distance
density-use_gaussians = True
decompose-radius-O = 0.88
decompose-radius-H = 0.60
mix-coef = 0.7
nprocs = 1
