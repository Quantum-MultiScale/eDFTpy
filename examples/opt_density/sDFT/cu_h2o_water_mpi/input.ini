[JOB]
task               = Optdensity

[PATH]
pp                 = ../../../DATA/
cell               = ../../../DATA/

[PP]
Cu                 = cu_pbe_v1.2.uspp.F.UPF
O                  = o_pbe_v1.2.uspp.F.UPF
H                  = h_pbe_v1.4.uspp.F.UPF
Cl                 = cl_pbe_v1.4.uspp.F.UPF

[OPT]
maxiter            = 600
econv              = 1e-5
olevel             = 3

[MOL]
charge-Cu          = 2
charge-H2O         = 0
charge-Cl          = -1
magmom-Cu  = 1
magmom-H2O = 0
magmom-Cl = 0

[GSYSTEM]
cell-file          = cu_hexa.xyz
grid-ecut          = 2700
exc-x_str          = gga_x_pbe
exc-c_str          = gga_c_pbe
kedf-kedf          = GGA
kedf-k_str         = revAPBEK
density-output     = total.xsf
density-nspin       = 2
;decompose-method    = distance
;decompose-radius-Cu = 2.50
;decompose-radius-Cl = 1.20
;decompose-radius-O  = 0.88
;decompose-radius-H  = 0.60
;decompose-rtol      = 0.20

[SUB_CU]
calculator         = qe
embed              = KE XC
basefile            = qe_in_cu.in
cell-cut            = 3.5 3.5 3.5
cell-index         = 0:19
density-use_gaussians = True
density-output     = .xsf
mix-coef = 0.7
decompose-method    = distance
decompose-radius-Cu = 2.50
decompose-radius-O  = 0.88
decompose-radius-H  = 0.60
nprocs = 14

[SUB_CL]
calculator          = pwscf
embed               = KE
cell-cut            = 3.5 3.5 3.5
cell-index          = 19:21
basefile            = qe_in_cl.in
density-use_gaussians = True
decompose-method    = distance
decompose-radius-Cl = 1.20
mix-coef            = 0.7
nprocs = 1

[SUB_H2O]
calculator         = qe
embed              = KE XC
cell-cut            = 3.5 3.5 3.5
cell-index         = 21:
basefile            = qe_in.in
decompose-method   = distance
density-use_gaussians = True
decompose-radius-O = 0.88
decompose-radius-H = 0.60
mix-coef = 0.7
nprocs = 1
