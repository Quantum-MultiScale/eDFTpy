[JOB]
task                = Optdensity

[PATH]
pp                  = ../../DATA
cell                = ../../DATA

[PP]
Ni                  = ni_pbe_v1.4.uspp.F.UPF
O                   = o_pbe_v1.2.uspp.F.UPF
H                   = h_pbe_v1.4.uspp.F.UPF
Cl                  = cl_pbe_v1.4.uspp.F.UPF

[OPT]
maxiter             = 500
econv               = 1e-6
olevel              = 2
maxtime             = 259000

[MOL]
charge-Ni  = 2
charge-H2O = 0
charge-Cl = -1
magmom-Ni  = 2
magmom-H2O = 0
magmom-Cl = 0

[GSYSTEM]
cell-file           = ni.xyz
grid-ecut           = 2700
exc-dftd4           = PBE
exc-x_str           = gga_x_pbe
exc-c_str           = gga_c_pbe
kedf-kedf           = GGA
kedf-k_str          = revAPBEK
density-nspin       = 2
decompose-method    = distance
decompose-radius-Ni = 2.52
decompose-radius-Cl = 1.20
decompose-radius-O  = 0.88
decompose-radius-H  = 0.60
decompose-rtol      = 0.20

[SUB_PD]
calculator          = pwscf
embed               = KE XC
cell-cut            = 3.5 3.5 3.5
cell-index          = 0:19
basefile            = qe_in_ni.in
density-use_gaussians = True
mix-coef            = 0.7
decompose-method    = distance
decompose-radius-Ni = 2.52
decompose-radius-O  = 0.88
decompose-radius-H  = 0.60
nprocs              = 8

[SUB_CL]
calculator          = pwscf
embed               = KE XC
cell-cut            = 3.5 3.5 3.5
cell-index          = 19:21
basefile            = qe_in_cl.in
density-use_gaussians = True
decompose-method    = distance
decompose-radius-Cl = 1.20
mix-coef            = 0.7
nprocs              = 1

[SUB_H20]
calculator          = pwscf
embed               = KE XC
cell-cut            = 3.5 3.5 3.5
cell-index          = 21:
basefile            = qe_in.in
density-use_gaussians = True
decompose-method      = distance
decompose-radius-O = 0.8
decompose-radius-H = 0.5
mix-coef            = 0.7
nprocs              = 1
