[JOB]
task               = Optdensity

[PATH]
pp                 = ../pseudo/
cell               = ../

[PP]
Na     = na_pbe_v1.5.uspp.F.UPF
Cl     = cl_pbe_v1.4.uspp.F.UPF

[OPT]
maxiter            = 2000
econv              = 1e-4

[MOL]
charge-Na  = 1
charge-Cl  = -1

[GSYSTEM]
cell-file          = nacl.xyz
grid-nr = 60 60 60
exc-x_str          = gga_x_pbe
exc-c_str          = gga_c_pbe
kedf-kedf          = GGA
kedf-k_str         = revAPBEK
mix-maxm           = 10
mix-coef           = 0.2
mix-delay          = 4

# 4 Na+ ions
[SUB_NA]
calculator         = qe
basefile           = na.in
mt                 = True
decompose-method   = distance
decompose-radius-Na = 0.5
embed              = KE XC HARTREE PSEUDO
embedpot           = .snpy
cell-index         = :4
mix-coef           = 0.4
density-use_gaussians = True
nprocs = 1

# The other 3 Cl- ions
[SUB_CL]
calculator         = qe
basefile           = cl.in
mt                 = True
decompose-method   = distance
decompose-radius-Cl = 0.5
embed              = KE XC HARTREE PSEUDO
embedpot           = .snpy
cell-index         = 5:
mix-coef           = 0.4
density-use_gaussians = True
nprocs = 1

# Impurity: first Cl- oxidized to Cl (charge 0, doublet)
# mt_neutral_potential = screening potential of the same ion from ../standard
[SUB_CL_c]
calculator         = qe
basefile           = cl_oxidized.in
mt                 = True
embed              = KE XC HARTREE PSEUDO
embedpot           = .snpy
cell-index         = 4:5
density-ncharge    = 0
density-nspin      = 2
mix-coef           = 0.4
density-use_gaussians = True
mt_neutral_potential = ../standard/sub_cl_0.screen.snpy
nprocs = 1
