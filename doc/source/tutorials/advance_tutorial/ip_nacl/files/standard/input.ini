[JOB]
task               = Optdensity

[PATH]
pp                 = ../pseudo/
cell               = ../

[PP]
Na     = na_pbe_v1.5.uspp.F.UPF
Cl     = cl_pbe_v1.4.uspp.F.UPF

[OPT]
maxiter            = 2000
econv              = 1e-4

[MOL]
charge-Na  = 1
charge-Cl  = -1

[GSYSTEM]
cell-file          = nacl.xyz
grid-nr = 60 60 60
exc-x_str          = gga_x_pbe
exc-c_str          = gga_c_pbe
kedf-kedf          = GGA
kedf-k_str         = revAPBEK
mix-maxm           = 10
mix-coef           = 0.2
mix-delay          = 4

# 4 Na+ ions, each one its own subsystem
[SUB_NA]
calculator         = qe
basefile           = na.in
mt                 = True
decompose-method   = distance
decompose-radius-Na = 0.5
embed              = KE XC HARTREE PSEUDO
embedpot           = .snpy
cell-index         = :4
mix-coef           = 0.4
mt_screening = True
density-use_gaussians = True
nprocs = 1

# 4 Cl- ions, each one its own subsystem
[SUB_CL]
calculator         = qe
basefile           = cl.in
mt                 = True
decompose-method   = distance
decompose-radius-Cl = 0.5
embed              = KE XC HARTREE PSEUDO
embedpot           = .snpy
cell-index         = 4:
mix-coef           = 0.4
mt_screening = True
density-use_gaussians = True
nprocs = 1
