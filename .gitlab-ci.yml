image: registry.gitlab.com/shaoxc/qepy:qepy-7.2g-dev

Test:
  before_script:
    - home=$( pwd )
    - git clone -b mpi2 https://github.com/Quantum-MultiScale/DFTpy.git
    - cd DFTpy
    - python -m pip install .
    - cd ..
  script:
   - python -m pip install .
   - cd examples
   - pytest --cov-report term-missing --cov=./ ./examples/test/
   - export MPIRUN="mpirun --allow-run-as-root --oversubscribe -n 4"
   - for d in $(find ./mpitest/ -maxdepth 1 -mindepth 1 -type d); do cd $d; ./run.sh ; cd ../..; done
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+\%)/'
